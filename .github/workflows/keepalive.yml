# Keeps the free Supabase project awake. A free project pauses after about a week
# with no requests, and the Einladen form, the admin page and the dates all live in it.
# This asks it for the site row every three days. Run it by hand: Actions > Keep Supabase awake > Run workflow.
name: Keep Supabase awake
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ask Supabase for the site row
        run: |
          KEY='sb_publishable_wbAdbAS-TPcojUiQMNr-jg_Zv72DF7p'
          curl -fsS --retry 5 --retry-delay 20 --retry-all-errors --max-time 60 \
            "https://zxsgxihknyexyzzpddmg.supabase.co/rest/v1/screen_site?select=updated_at&id=eq.1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY"
